# =============================================================================
# SGDF — ambiente de homologação (Onda 0 do plano de implantação).
#
# NÃO É PRODUÇÃO. Em produção o banco é gerenciado com PITR (SEC-08), os
# segredos vêm do cofre e não de arquivo, e as réplicas são do orquestrador.
# Este arquivo existe para que HML suba com um comando e para que o pipeline
# tenha onde rodar os testes que precisam de banco.
#
#   cp .env.exemplo .env && $EDITOR .env && docker compose up -d
# =============================================================================

services:
  banco:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: sgdf
      POSTGRES_USER: ${SGDF_JDBC_USUARIO:-sgdf_app}
      POSTGRES_PASSWORD: ${SGDF_JDBC_SENHA:?defina SGDF_JDBC_SENHA no .env}
    volumes:
      - dados-banco:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      # O serviço só sobe quando o banco ACEITA CONEXÃO, não quando o contêiner
      # existe. Sem isso o app sobe primeiro, falha ao conectar e reinicia em
      # laço — e o sintoma parece defeito de configuração.
      test: ["CMD-SHELL", "pg_isready -U ${SGDF_JDBC_USUARIO:-sgdf_app} -d sgdf"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Não expõe porta para fora: quem precisa entra pela rede do compose.
    # Publicar 5432 em HML é o caminho mais curto para alguém apontar uma
    # ferramenta de produção para cá por engano.
    expose:
      - "5432"

  # SEM ESTE SERVIÇO, `docker compose up -d` SOBE A APLICAÇÃO CONTRA UM BANCO
  # VAZIO — E ELA FICA "SAUDÁVEL".
  #
  # Medido: `docker compose up -d` e, em seguida, `\dt` no banco:
  # "Did not find any relations." O arquivo montava ./db no contêiner do
  # postgres e nada rodava aquilo. Pior, o HEALTHCHECK da aplicação bate em
  # /actuator/health, cujo indicador de banco faz um `SELECT 1` — que funciona
  # numa base sem tabela nenhuma. O contêiner reportaria saudável e a primeira
  # requisição de verdade quebraria.
  #
  # Roda uma vez, antes da aplicação, e ela só sobe se isto terminar bem
  # (`service_completed_successfully`).
  migracao:
    image: postgres:16.4-alpine
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PGHOST: banco
      PGUSER: ${SGDF_JDBC_USUARIO:-sgdf_app}
      PGPASSWORD: ${SGDF_JDBC_SENHA:?defina SGDF_JDBC_SENHA no .env}
      PGDATABASE: sgdf
    volumes:
      - ./db:/db:ro
    command: ["sh", "/db/subir.sh"]
    restart: "no"

  clamd:
    # SEC-05: a varredura verifica antes de extrair. Sem este serviço o veredito
    # sai NAO_APLICAVEL e o documento segue com a marca de não verificado — o
    # sistema não trava (cap. 1, princípio 1), mas a trilha registra.
    image: clamav/clamav:1.5.4
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      banco:
        condition: service_healthy
      migracao:
        condition: service_completed_successfully
    environment:
      SGDF_JDBC_URL: jdbc:postgresql://banco:5432/sgdf
      SGDF_JDBC_USUARIO: ${SGDF_JDBC_USUARIO:-sgdf_app}
      SGDF_JDBC_SENHA: ${SGDF_JDBC_SENHA}
      SGDF_OIDC_ISSUER: ${SGDF_OIDC_ISSUER:?defina SGDF_OIDC_ISSUER no .env}
      SGDF_CLAMD_HOST: clamd
      SGDF_CLAMD_PORTA: "3310"
      SGDF_INSTANCIA: ${SGDF_INSTANCIA:-hml-01}
    # O ENDEREÇO DE ESCUTA É CONFIGURÁVEL, E O PADRÃO CONTINUA SENDO FECHADO.
    #
    # `127.0.0.1` por padrão: em HML, publicar a porta para toda a rede é o
    # caminho mais curto para alguém apontar uma ferramenta de produção para cá
    # por engano.
    #
    # Num servidor dedicado atrás de proxy reverso — que é o caso do
    # sad.engesoftware.com.br — o proxy está em OUTRA máquina e precisa alcançar
    # esta porta. Aí `SGDF_BIND=0.0.0.0` é necessário, e a proteção passa a ser
    # de rede (firewall e grupo de segurança), não de bind.
    #
    # Abrir isto é decisão de implantação e fica explícita no .env, em vez de
    # ficar escondida numa linha do compose que ninguém releu.
    #
    # A APLICAÇÃO CONTINUA SEM RODAR COMO ROOT, mesmo na porta 80: quem escuta
    # 80 é o Docker, no host; dentro do contêiner o processo segue em 8080 como
    # o usuário `sgdf` (cap. 15.1). Trocar o EXPOSE para 80 exigiria root no
    # contêiner — que é exatamente o que não se faz.
    ports:
      - "${SGDF_BIND:-127.0.0.1}:${SGDF_PORTA:-8080}:8080"
    # Endurecimento que custa nada e fecha caminhos inteiros de exploração.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  dados-banco:
