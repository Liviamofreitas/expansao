# =============================================================================
# SGDF — pipeline. SEC-07: "Gate no CI."
#
# A ORDEM É DELIBERADA: o que é barato e pega muita coisa vem antes. Um build
# que gasta dez minutos para descobrir que o código não compila é um build que
# as pessoas param de esperar — e um gate que ninguém espera é um gate desligado.
# =============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  security-events: write   # para publicar o SARIF do SCA

jobs:
  testes:
    name: Compilar e testar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: sgdf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Esquema, carga e testes de banco
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sgdf
        # Os testes SQL são a rede que vale mesmo quando o serviço erra: eles
        # rodam contra o esquema, sem passar por Java nenhum.
        run: ./db/aplicar.sh

      - name: Suíte completa
        env:
          SGDF_JDBC: jdbc:postgresql://localhost:5432/sgdf?user=postgres&password=postgres
          # SGDF_MASSA NÃO é definida. A massa real não vive no repositório
          # (cap. 19) e o medidor de precisão se pula dizendo por quê — em vez
          # de passar em silêncio, que esconderia que a precisão não foi medida.
        run: ./scripts/testar-app.sh

      - name: Empacotar
        run: cd app && mvn -B -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: sgdf-jar
          path: app/target/sgdf-*.jar
          retention-days: 7

  sca:
    name: SCA de dependências (SEC-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # RESTORE E SAVE SEPARADOS, E O SAVE COM `if: always()`.
      #
      # O CICLO VICIOSO QUE ISTO QUEBRA. `actions/cache` só grava o cache
      # quando o JOB TERMINA BEM. Este job existe para falhar quando há CVE
      # alta — e falhou. Logo o cache nunca era gravado, logo a execução
      # seguinte baixava a base da NVD inteira de novo: 2h10min, TODA VEZ.
      #
      # Quanto mais o gate funciona, mais caro ele fica. É assim que um gate
      # morre: não por alguém discordar dele, mas por ele custar duas horas
      # por push até que desligá-lo pareça razoável.
      #
      # A base é dado público e imutável — nada que o gate decida muda o que
      # deve ser cacheado. Gravar em `always()` é correto, e não um atalho.
      - name: Restaurar a base da NVD
        id: nvd
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # PREFIXO NOVO PARA ABANDONAR O CACHE ENVENENADO.
          #
          # A execução 15 gravou 2 MB de base quebrada sob `nvd-...`, e
          # `restore-keys: nvd-` casaria com ela para sempre. Não há como apagar
          # um cache daqui sem permissão de escrita em Actions; trocar o prefixo
          # o abandona de vez e custa uma reconstrução. As entradas velhas
          # expiram sozinhas por desuso.
          key: nvd2-${{ github.run_id }}
          restore-keys: nvd2-

      # failBuildOnCVSS=7 está no perfil: CRÍTICA e ALTA barram o release.
      # SEM CHAVE DA NVD, ESTE JOB LEVA HORAS — E ISSO PRECISA SER DITO.
      #
      # A primeira execução gastou 2h10min. Não é lentidão do scanner: sem
      # chave, a NVD limita a requisição a uma a cada poucos segundos, e a base
      # tem dezenas de milhares de registros. O cabeçalho deste arquivo diz que
      # um build que as pessoas param de esperar é um gate desligado — duas
      # horas é exatamente isso.
      #
      # Avisa e continua, em vez de falhar: falhar por falta de chave
      # esconderia o resultado do SCA, que é o que o job existe para produzir.
      # A chave é gratuita em https://nvd.nist.gov/developers/request-an-api-key
      - name: OWASP Dependency-Check
        id: dc
        # NÃO derruba o job aqui. O passo "Veredito", no fim, decide — e a
        # decisão depende de DISTINGUIR duas falhas que hoje eram a mesma cor.
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::warning title=NVD sem chave de API::O segredo NVD_API_KEY não \
          está definido. O download da base da NVD vai levar HORAS em vez de \
          minutos. Peça a chave (gratuita) em \
          https://nvd.nist.gov/developers/request-an-api-key e cadastre-a em \
          Settings > Secrets > Actions."
          fi
          cd app && mvn -B -Psca verify -DskipTests

      # SÓ GUARDA A BASE SE ELA PRESTA — e o relatório é a prova disso.
      #
      # A primeira versão deste passo era `if: always()`, e isso estava errado
      # por um motivo que só apareceu rodando: quando a NVD devolveu HTTP 524 o
      # download morreu no meio, a base ficou vazia ("NoDataException: No
      # documents exist") — e o save guardou 2 MB de base quebrada no cache.
      # A execução seguinte restauraria o lixo.
      #
      # O relatório existir é equivalente a a análise ter rodado até o fim, e a
      # análise só roda até o fim com base válida. É o sinal observável que
      # separa "o gate reprovou" de "o scanner não conseguiu rodar".
      - name: Guardar a base da NVD
        if: always() && hashFiles('app/target/dependency-check-report.sarif') != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd2-${{ github.run_id }}

      - name: Publicar achados
        if: always() && hashFiles('app/target/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/target/dependency-check-report.sarif
        continue-on-error: true

      # AUSÊNCIA DE VEREDITO NÃO É APROVAÇÃO — E NÃO É A MESMA COISA QUE REPROVA.
      #
      # As duas falhavam vermelho igual, e quem lê "SCA de dependências ❌"
      # conclui "há CVE alta". Pode ser isso, ou pode ser que o scanner não
      # tenha conseguido montar a base — que é ausência de resposta, não uma
      # resposta ruim. As duas barram o release, e é certo que barrem: publicar
      # sem saber é pior que publicar sabendo. Mas mandam procurar em lugares
      # opostos, e o log tem de dizer qual das duas foi.
      - name: Veredito
        if: always()
        run: |
          if [ "${{ steps.dc.outcome }}" = "success" ]; then
            echo "SCA: nenhuma dependência com CVE >= 7,0."
            exit 0
          fi
          if [ -f app/target/dependency-check-report.sarif ]; then
            echo "::error title=SCA REPROVOU::Há dependência com CVE de CVSS >= 7,0. \
          A lista está no log acima e os achados na aba Security. Isto É um \
          veredito: suba a versão da dependência."
            exit 1
          fi
          echo "::error title=O SCA NAO RODOU::O scanner não conseguiu montar a base \
          da NVD (ex.: HTTP 524, ou limite de requisição por falta de NVD_API_KEY). \
          ISTO NAO E UM VEREDITO SOBRE AS DEPENDENCIAS — e ausencia de veredito nao \
          e aprovacao. Cadastre o segredo NVD_API_KEY e rode de novo."
          exit 1

  imagem:
    name: Construir e escanear a imagem (SEC-07)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - name: Construir
        run: docker build -t sgdf:${{ github.sha }} .

      # "imagem base fixada E ESCANEADA". Fixar sem escanear dá a ilusão de
      # controle: a base congelada continua acumulando CVE, e congelá-la é
      # justamente o que impede que ela se conserte sozinha.
      # O TAG TEM `v`, E FOI ISSO QUE DERRUBOU O JOB EM 3 SEGUNDOS.
      #
      # `@0.28.0` não existe; `@v0.28.0` existe. O erro foi
      # "Unable to resolve action ... unable to find version", ANTES de o
      # docker build rodar — a imagem continuou nunca tendo sido construída, e
      # o job vermelho dizia "escaneamento falhou" quando o que falhou foi
      # resolver a própria ação.
      # DUAS PASSADAS, E A PRIMEIRA EXISTE PARA SER LIDA.
      #
      # Com `format: sarif` o Trivy escreve tudo num arquivo e o console fica
      # mudo: o job falha com "exit code 1" e quem abre o log não descobre QUAL
      # pacote, QUAL CVE, nem se há correção. Aconteceu — a primeira vez que
      # esta etapa de fato rodou, ela reprovou a imagem sem dizer por quê, e a
      # resposta só existia num SARIF na aba de segurança.
      #
      # Uma recusa que não diz o que fazer a seguir custa quase tanto quanto o
      # defeito que ela evitou. A tabela vai para o log com `exit-code: 0` —
      # informa e não barra; o SARIF barra. O banco do Trivy é baixado uma vez
      # e reaproveitado entre as duas etapas.
      - name: Escanear (tabela legível no log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sgdf:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      # `ignore-unfixed: true` é deliberado: CVE sem correção publicada não é
      # acionável por quem constrói a imagem, e barrar nela produziria a
      # exceção permanente que mata o gate. O que passa por aqui, portanto,
      # TEM correção disponível.
      - name: Escanear (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sgdf:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Publicar achados
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
        continue-on-error: true

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o histórico inteiro: um segredo comitado e removido
                           # continua no histórico, e é lá que ele é encontrado
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
