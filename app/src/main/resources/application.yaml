# Configuração do serviço. Nada de segredo aqui: credenciais são referência de
# cofre (cap. 15), e o que estiver neste arquivo vai para o repositório.
server:
  port: ${SGDF_PORTA:8080}
  error:
    include-message: never      # o motivo do 403 vai para o log, não para o cliente
    include-stacktrace: never

spring:
  application:
    name: sgdf
  datasource:
    url: ${SGDF_JDBC_URL}
    username: ${SGDF_JDBC_USUARIO}
    password: ${SGDF_JDBC_SENHA}
    hikari:
      maximum-pool-size: ${SGDF_POOL:10}
  security:
    oauth2:
      resourceserver:
        jwt:
          # O provedor de identidade da organização. A autenticação com MFA é
          # dele; a autorização é do Autorizador (cap. 15.1).
          issuer-uri: ${SGDF_OIDC_ISSUER}

management:
  endpoints:
    web:
      # O BASE-PATH FALTAVA, E SEM ELE O HEALTHCHECK NUNCA PODIA PASSAR.
      #
      # A ConfiguracaoDeSeguranca libera "/saude" com permitAll e exige
      # autenticação em todo o resto. Sem esta linha o endpoint de saúde mora em
      # /actuator/health, que cai no `anyRequest().authenticated()` — medido:
      # HTTP 401 em /actuator/health, /saude e /saude/health, e o HEALTHCHECK do
      # contêiner registrando "wget: server returned error: HTTP/1.1 401" a cada
      # 30 segundos, para sempre.
      #
      # Um contêiner permanentemente unhealthy é reiniciado em laço pelo
      # orquestrador, com a aplicação funcionando perfeitamente. O sintoma não
      # aponta para a causa em lugar nenhum.
      #
      # Expor saúde sem autenticação é deliberado e seguro AQUI por causa do
      # `show-details: never` logo abaixo: a resposta é {"status":"UP"} e nada
      # mais. Um health que diz QUAL dependência caiu conta topologia a quem não
      # está autenticado.
      base-path: /saude
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# --- agendador (RA-07, cap. 7.6) --------------------------------------------
# DESLIGADO POR PADRÃO, e a ausência de configuração não liga nada. Ligar é ato
# deliberado, e continua gated na F3-01 para a régua de notificação: o sistema só
# deve cobrar áreas depois de a divergência estar medida (risco P01, cap. 22).
#
# Na Onda 1 do plano de implantação ele roda SEM notificar — e é o que faz o
# painel ter o que mostrar.
sgdf:
  agendador:
    ativo: ${SGDF_AGENDADOR_ATIVO:false}
    cron:
      # Horários em America/Sao_Paulo. Madrugada para a abertura (cap. 7.6) e
      # início do expediente para a régua, que é quando a cobrança tem efeito.
      abertura: ${SGDF_CRON_ABERTURA:0 10 3 * * *}
      regua: ${SGDF_CRON_REGUA:0 0 8 * * *}
